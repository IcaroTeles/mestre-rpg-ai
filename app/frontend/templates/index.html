<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="screen">
        <section class="panel" aria-labelledby="title">
            <div class="sigil" aria-hidden="true">20</div>
            <p class="eyebrow">Sistema de campanha em prototipagem</p>
            <h1 id="title">{{ app_name }}</h1>
            <p class="subtitle">Narrativas de fantasia guiadas por tecnologia local.</p>

            <div class="status-grid">
                <article class="status-card">
                    <span class="status-label">Servidor</span>
                    <strong id="server-status" class="status-value">Verificando...</strong>
                </article>
                <article class="status-card">
                    <span class="status-label">Ollama</span>
                    <strong id="ollama-status" class="status-value">Verificando...</strong>
                </article>
                <article class="status-card">
                    <span class="status-label">Modelo configurado</span>
                    <strong class="status-value">{{ ollama_model }}</strong>
                </article>
            </div>

            <p class="warning">Aplicacao em prototipagem. Recursos de campanha e chat serao adicionados em etapas futuras.</p>
        </section>
    </main>
    <script src="/static/js/app.js"></script>
</body>
</html>
